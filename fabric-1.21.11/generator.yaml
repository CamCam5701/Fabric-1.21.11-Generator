name: Fabric for @minecraft (@buildfileversion)
status: stable
buildfileversion: 0.141.6+1.21.11
subversion: 0

import:
  - datapack-1.21.1
  - neoforge-1.21.1:
    exclude:
      - procedures
      - triggers

# Gradle task definitions
gradle:
  sync_task: genSources
  run_client: runClient
  run_server: runServer
  export_file: "build/libs/modid-1.0.jar"

